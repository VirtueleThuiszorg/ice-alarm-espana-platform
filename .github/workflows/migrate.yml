name: Migrate Production

# CI APPLIES SCHEMA. This is the workflow that removed the last laptop-only step.
#
# Production used to be migrated by a human running `supabase db push`, and the record of what had
# been applied was a file that same human was trusted to update. It went wrong in the obvious way:
# production sat 6 WEEKS AND 24 MIGRATIONS behind main, and the drift was discoverable only when a
# query failed against a column that did not exist.
#
# ── WHY THE DEPLOY IS IN THIS FILE, AND NOT ITS OWN ANY MORE ───────────────────
#
# Functions must not go live before the schema they read. On 2026-09-09 #277 deployed while
# `20260909121500_notify_staff.sql` was still unapplied: `makeStore.routes()` threw on the missing
# table, `notify-admin` answered 500, and all TWELVE of its events stopped — including the four
# that report the safety machinery itself failing (runner dead, an SOS rung that reached nobody,
# no emergency contacts, contacts not notified). Every caller wraps the call in try/catch, so the
# loss was SILENT. That cost a second PR (#280) to make the router survive it.
#
# Ordering that with two separate workflows has a race that is easy to miss: a push touching a
# migration AND a function would start the deploy workflow on the `push` trigger immediately,
# while also being chained after the migration — so the function still goes live first, exactly
# once, on the pushes where it matters most. `paths:` filters a workflow, not a job, and cannot
# express "functions but NOT migrations".
#
# So there is ONE workflow with dependent jobs, and the dependency is the ordering:
#
#   changes ─┬─► migrate ──► deploy
#            └──────────────► (deploy alone when no migration changed: migrate is `skipped`,
#                              and `skipped` is an allowed predecessor — `failure` is not)
#
# ── SECRETS FAIL, THEY NEVER SKIP ─────────────────────────────────────────────
#
# The three secrets are required, and a missing one fails the job naming it. The previous deploy
# workflow skipped its whole deploy and reported SUCCESS when its credentials were absent, so
# "green" meant either "deployed" or "never tried". On 2026-09-09 the token was a wrong-account
# token and returned 403 — the skip logic would have hidden a missing one entirely.
#
# SUPABASE_DB_PASSWORD is passed only through `env`, never as a command-line argument, so it
# cannot appear in a log line or a process list. No step echoes any of the three.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: "Also deploy edge functions after migrating"
        type: boolean
        default: false

concurrency:
  # Never two of these at once, and never cancel one: a cancelled `db push` leaves production in a
  # state nobody recorded. Queueing is correct here even though it is slower.
  group: migrate-prod
  cancel-in-progress: false

permissions:
  # To commit APPLIED_TO_PROD.txt back to main. Nothing else.
  contents: write

jobs:
  # Which of the two jobs below should run. `paths:` above decides whether the WORKFLOW runs; this
  # decides per job, which is what makes "deploy alone when no migration changed" possible.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      migrations: ${{ steps.detect.outputs.migrations }}
      functions: ${{ steps.detect.outputs.functions }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          WANT_DEPLOY: ${{ inputs.deploy_functions }}
        run: |
          set -euo pipefail

          if [ "$IS_DISPATCH" = "true" ]; then
            # A manual run is an explicit "apply whatever is pending". Functions are deployed only
            # if asked for, because a dispatch is usually somebody clearing a migration backlog and
            # redeploying every function as a side effect would be a surprise.
            echo "migrations=true"                >> "$GITHUB_OUTPUT"
            echo "functions=${WANT_DEPLOY:-false}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `github.event.before` is all-zeroes for a new branch and can point at a commit that no
          # longer exists after a force-push. Either way, fall back to the first parent rather than
          # guessing "nothing changed" — the strict direction is to run the migration job, because
          # `db push` on an up-to-date database is a no-op while a skipped push is drift.
          if [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          else
            echo "::notice::No usable before-SHA; comparing against the first parent."
            changed=$(git diff --name-only "${GITHUB_SHA}^" "$GITHUB_SHA" || echo "supabase/migrations/")
          fi

          echo "$changed"

          if grep -q '^supabase/migrations/' <<< "$changed"; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -qE '^supabase/(functions/|config\.toml)' <<< "$changed"; then
            echo "functions=true" >> "$GITHUB_OUTPUT"
          else
            echo "functions=false" >> "$GITHUB_OUTPUT"
          fi

  migrate:
    name: Apply migrations to production
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # Read by the CLI from the environment. Deliberately not passed as `--password`, so it never
      # reaches a command line, a log, or `ps`.
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The manifest commit at the end pushes back to main, so the credentials must persist.
          ref: main
          fetch-depth: 0

      - name: Require migrate secrets
        run: >
          node scripts/ci/require-secrets.mjs
          SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # BEFORE TOUCHING PRODUCTION. Two files' worth of checks, both cheap:
      #   migrationDrift        no two migrations share a version (of two sharing one, the CLI runs
      #                         at most one and records the other as applied without having been),
      #                         every migration is named version-first, manifest sanity.
      #   migrationManifest     the before/after diff that decides what gets recorded.
      # A red result here means the repo's migration set is malformed, and pushing a malformed set
      # to production is the one mistake this whole workflow exists to avoid.
      - name: Migration tests must be green before production is touched
        run: >
          npx vitest run
          src/test/migrationDrift.test.ts
          src/test/migrationManifestRecording.test.ts

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # ── REACH PRODUCTION: the Management API if it will have us, the pooler if it will not ──
      #
      # `supabase link` calls the Management API, and on 2026-09-10 it began refusing:
      #
      #   Authorization failed for the access token and project ref pair:
      #   {"message":"Your account does not have the necessary privileges to access this endpoint."}
      #
      # THE TOKEN IS NOT DEAD, which is the whole reason this fallback is legitimate. Forty-six
      # minutes after that refusal, run #6 used the SAME `SUPABASE_ACCESS_TOKEN` and the SAME
      # `SUPABASE_PROJECT_REF` to deploy every edge function to that project. One endpoint refuses
      # the token, another accepts it and writes to production — so the account does reach the
      # project, and what is missing is only the privilege `link` needs. Restoring that is an
      # org-role change and PENDING_FOR_LEE section 1 asks for it.
      #
      # Meanwhile a correct, tested, merged migration sat unapplied: the holiday balances stayed
      # wrong on production and the next PR was held shut behind the stacking gate. Nothing about
      # applying a migration actually requires the Management API.
      #
      # WHAT `link` DOES THAT WE NEED, and it is not authorisation. It writes two files into the
      # gitignored `supabase/.temp/`: the project ref, and the IPv4 POOLER connection string. With
      # only the ref, `--linked` tries the direct host and dies with
      # `LegacyDbConfigIpv6Error: IPv6 is not supported on your current network` — because
      # `db.<ref>.supabase.co` has no A record (checked) and GitHub runners are IPv4. So the
      # fallback writes those two files itself and every step after this one is UNCHANGED: still
      # `--linked`, still reading the password from the environment.
      #
      # THE PASSWORD STILL NEVER REACHES A COMMAND LINE. `--db-url` would have put it in argv and
      # broken this file's promise (and `ciJobIsolation.test.ts` enforces that promise). It goes
      # into a 0600 file the CLI reads, and the percent-encoded form is masked explicitly because
      # it is a different string from the registered secret and GitHub would not mask it itself.
      #
      # SESSION MODE, PORT 5432. Transaction mode (6543) cannot run migrations.
      #
      # LINK IS TRIED FIRST, so when the privilege is restored this job silently returns to the
      # path runs #1-#6 used, and the fallback stops being exercised. It is a fallback, not a
      # replacement — AND IT SHOUTS, because a fallback that quietly rescues a broken credential
      # is how a broken credential stays broken. Green here does not mean the token is fine.
      - name: Reach production
        id: conn
        run: |
          set -uo pipefail

          if supabase link --project-ref "$SUPABASE_PROJECT_REF" 2>/tmp/link.err; then
            echo "reached production through the Management API (supabase link)"
            echo "mode=linked" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "supabase link was refused:" >&2
          sed 's/^/  /' /tmp/link.err >&2

          ENC="$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')"
          echo "::add-mask::$ENC"

          mkdir -p supabase/.temp
          printf '%s' "$SUPABASE_PROJECT_REF" > supabase/.temp/project-ref

          # `eu-west-1` is this project's region (docs/archive/AUDIT_REPORT_2026-06.md section 5,
          # indexed by PROJECT_REFS.md). Both regional endpoints resolve, and which one serves a
          # given project is not derivable, so each is PROBED with a READ-ONLY `migration list`.
          # Nothing is written to production until a connection is known to work.
          for HOST in aws-0-eu-west-1.pooler.supabase.com aws-1-eu-west-1.pooler.supabase.com; do
            umask 077
            printf 'postgresql://postgres.%s:%s@%s:5432/postgres' \
              "$SUPABASE_PROJECT_REF" "$ENC" "$HOST" > supabase/.temp/pooler-url
            chmod 600 supabase/.temp/pooler-url
            echo "probing $HOST (read-only)..."
            if supabase migration list --linked > /tmp/probe.txt 2>/tmp/probe.err; then
              echo "connected through $HOST"
              echo "mode=pooler" >> "$GITHUB_OUTPUT"
              echo "host=$HOST" >> "$GITHUB_OUTPUT"
              echo "::warning title=Migrated WITHOUT the Management API::supabase link was refused, so this run reached the database directly through $HOST. The access token still lacks the privilege link needs - see PENDING_FOR_LEE section 1. This is a fallback, not a fix."
              exit 0
            fi
            sed 's/^/  /' /tmp/probe.err >&2
          done

          rm -f supabase/.temp/pooler-url
          echo "::error title=Cannot reach production at all::supabase link was refused AND no pooler candidate authenticated. Nothing has been applied. Fix SUPABASE_ACCESS_TOKEN (PENDING_FOR_LEE section 1), or the database password if that is what the probe rejected."
          exit 1

      # Captured to a file rather than parsed inline: the same text is the input to the recorder
      # AFTER the push, and the two captures are the only evidence of what this run actually
      # changed. A partial push makes every other source of truth wrong.
      - name: Remote migration list BEFORE
        run: |
          set -euo pipefail
          supabase migration list --linked | tee /tmp/migrations-before.txt

      - name: Apply migrations
        id: push
        # The step is allowed to fail without ending the job, because `db push` can apply four of
        # five migrations and then fail on the fifth — and those four are really in production. The
        # recording steps below MUST run so the manifest names them. The job is then failed
        # explicitly by the last step; nothing here reports green on a failed push.
        continue-on-error: true
        # `--include-all` IS REQUIRED, and run #1 is why. Without it the CLI refuses the whole
        # push the moment any unapplied migration is OLDER than the newest applied one:
        #
        #   LegacyDbPushMissingRemoteError: Found local migration files to be inserted before
        #   the last migration on remote database.
        #   Rerun the command with --include-all flag to apply these migrations:
        #     supabase/migrations/20260909120000_rota_2026_seed_and_generator.sql
        #
        # Production was in exactly that state: `20260909121500_notify_staff.sql` had been applied
        # by hand while `20260909120000_rota…` had not, so the history skipped over the rota. The
        # first run therefore applied NOTHING and failed — correctly and loudly, which is the
        # design working, but it could not have got out of that state on its own.
        #
        # Reproduced before changing anything: a local Postgres seeded with production's exact 183
        # versions gives the error above, and `--include-all` then reports it would push exactly
        # the two genuinely pending files and nothing else.
        #
        # THE TRADE-OFF, STATED. `--include-all` will apply an old-timestamped migration that
        # somebody adds later, rather than refusing. That is the right default here because the
        # ordering hygiene is enforced earlier and by other means — the version-collision and
        # version-first guards in `migrationDrift.test.ts` run in this job before the push, and
        # the drift gate blocks a PR that stacks a migration on an unapplied one. Refusing instead
        # would mean a pipeline that stops dead until a human runs the CLI by hand, which is the
        # thing this workflow exists to remove.
        run: |
          set -o pipefail
          supabase db push --linked --include-all --yes 2>&1 | tee /tmp/push.log

      - name: Remote migration list AFTER
        if: always()
        run: |
          set -euo pipefail
          supabase migration list --linked | tee /tmp/migrations-after.txt

      # Appends EXACTLY the filenames whose versions appeared in the remote list after the push and
      # were absent before it. Not "the files we meant to push", not "everything pending" — the
      # database is asked what it has. Writes the job summary too.
      # ── AND WHAT THE DATABASE SAYS AFTERWARDS, not what the migration claimed ────────────────
      #
      # Every other step here reports on FILES: which migrations the remote history table gained.
      # That is the right question for drift and the wrong one for "is the number on the screen
      # correct now". The 2026 holiday backfill is the case in point — it raises an EXCEPTION if
      # the pre-cut day counts are wrong, so a clean apply does prove its inputs, and it computes
      # the resulting year totals into a `RAISE NOTICE` that the Supabase CLI does not surface.
      # The one thing nobody could read back was the balances themselves.
      #
      # So this asks the database, read-only, and puts the answer in the run summary. `psql` is
      # preinstalled on ubuntu-latest; the connection goes through libpq's ENVIRONMENT variables
      # (PGHOST/PGUSER/PGPASSWORD/...), never argv, so the password cannot reach a log line or
      # `ps` — the same rule the rest of this job follows.
      #
      # `continue-on-error`: this is a REPORT, not a gate. A migration that applied correctly must
      # not be reported as failed because a read-back could not connect, and the drift gate plus
      # the manifest already decide whether the run succeeded. It says so out loud when it cannot
      # read, rather than printing nothing and letting silence look like agreement.
      - name: The holiday balances, read back from production
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail

          if ! command -v psql >/dev/null; then
            echo "psql is not on this runner; skipping the read-back" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          export PGUSER="postgres.${SUPABASE_PROJECT_REF}"
          export PGDATABASE=postgres
          export PGPORT=5432
          export PGCONNECT_TIMEOUT=15

          SQL="SELECT first_name || ' ' || last_name || ': ' || days_approved || ' used, '
               || days_pending || ' pending, ' || days_remaining || ' left of '
               || annual_holiday_days
               FROM public.staff_holiday_balance
               WHERE lower(first_name) IN ('mary','carmen','albert','travis')
               ORDER BY first_name;"

          for HOST in aws-0-eu-west-1.pooler.supabase.com aws-1-eu-west-1.pooler.supabase.com; do
            export PGHOST="$HOST"
            if psql -At -c "$SQL" > /tmp/balances.txt 2>/tmp/balances.err; then
              {
                echo ""
                echo "### Holiday balances, as the database reports them"
                echo ""
                echo '```'
                cat /tmp/balances.txt
                echo '```'
                echo ""
                echo "_Read from \`staff_holiday_balance\` after the push, via ${HOST}._"
              } | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sed 's/^/  /' /tmp/balances.err >&2
          done

          echo "could not read the balances back — the push result above still stands" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Record what actually applied
        id: record
        if: always()
        continue-on-error: true
        run: >
          node scripts/ci/record-applied-migrations.mjs
          --before /tmp/migrations-before.txt
          --after /tmp/migrations-after.txt
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Commit the manifest to main
        if: always() && steps.record.outputs.applied_count != '0' && steps.record.outputs.applied_count != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          APPLIED_COUNT: ${{ steps.record.outputs.applied_count }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/APPLIED_TO_PROD.txt

          if git diff --cached --quiet; then
            echo "::notice::Manifest already up to date; nothing to commit."
            exit 0
          fi

          git commit -m "chore(prod): record ${APPLIED_COUNT} migrations applied by CI ${RUN_URL}"

          # main moves while this runs — other sessions merge constantly. Rebase and retry rather
          # than force anything: this commit only ever ADDS lines to one append-only file.
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Manifest recorded on main."
              exit 0
            fi
            echo "::notice::push rejected (attempt ${attempt}); rebasing on main and retrying."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done

          echo "::error title=Manifest not recorded::Migrations WERE applied to production but the manifest commit could not be pushed. Append them to supabase/migrations/APPLIED_TO_PROD.txt by hand — the run summary lists them."
          exit 1

      # The single place this job's verdict is decided, so a failed push can never be reported as
      # a success by an earlier step having gone green.
      - name: Verdict
        if: always()
        env:
          PUSH: ${{ steps.push.outcome }}
          RECORD: ${{ steps.record.outcome }}
        run: |
          set -euo pipefail
          echo "db push: ${PUSH} · record: ${RECORD}"

          if [ "$PUSH" != "success" ]; then
            echo "::error title=Migration push failed::\`supabase db push\` did not complete. Anything it DID apply has been recorded in APPLIED_TO_PROD.txt and is named in the run summary; the rest is still pending."
            exit 1
          fi

          if [ "$RECORD" != "success" ]; then
            echo "::error title=Manifest could not be reconciled::The push succeeded but production and this repo disagree about what exists. See the run summary."
            exit 1
          fi

          echo "Production matches this commit."

  deploy:
    name: Deploy functions to prod
    needs: [changes, migrate]
    # THE ORDERING GUARANTEE. `always()` is needed because `migrate` is skipped on a
    # functions-only push, and a skipped dependency would otherwise skip this job too. The
    # allowed predecessor states are spelled out rather than inverted: `success` (schema is in
    # place) and `skipped` (there was no schema change). NOT `failure`, and NOT `cancelled` — a
    # function that reads a table a failed migration never created is the #277 outage again.
    if: >
      always()
      && needs.changes.outputs.functions == 'true'
      && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require deploy secrets
        run: node scripts/ci/require-secrets.mjs SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all edge functions
        # `deploy` with no function name deploys every function under supabase/functions and
        # honours per-function verify_jwt in config.toml (e.g. the SOS ingress functions that must
        # stay verify_jwt=false).
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
