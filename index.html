    <!-- Google Fonts: Archivo (wordmark + headings) + Source Sans 3 (body). -->
    <!--
      THE GOOGLE FONTS LINK IS GONE, and it was never doing what it looked like.

      This site's Content-Security-Policy (vercel.json) allows
      `style-src 'self' 'unsafe-inline'` and `font-src 'self' data:`. Neither
      permits fonts.googleapis.com or fonts.gstatic.com — so the stylesheet was
      REFUSED by the browser and the fonts never applied. Every page has been
      rendering in the system fallback, while still paying for two preconnects
      and a render-blocking <link> to a host it was forbidden to use.

      The faces are now served from this origin (public/fonts, generated by
      scripts/perf/fetch-fonts.mjs) and declared in src/styles/fonts.css.

      PRELOADED: the two faces above the fold on every page — body text and the
      heading weight. A self-hosted @font-face is still only discovered when the
      CSS that references it has parsed, which on a slow connection is one round
      trip too late and shows as a flash of fallback text. The other twelve faces
      are left to be fetched on demand by unicode-range and weight.
    -->
    <link rel="preload" href="/fonts/source-sans-3-400-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/archivo-700-latin.woff2" as="font" type="font/woff2" crossorigin>

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
