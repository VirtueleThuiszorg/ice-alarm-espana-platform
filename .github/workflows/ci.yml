name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede an in-flight run for PR pushes only. On main every merge's verdict has to
  # survive: during the 2026-07-25 burst (#84-#88) each merge cancelled the previous main
  # run, so runs 168/171/172/174 read "cancelled" and the red X for the nl.json break never
  # appeared on main until two merges later. Only Vercel failed loudly.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-typecheck-build:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The migration-drift gate below diffs this branch against its merge base. The default
          # shallow clone has no merge base, and the gate then treats the PR as adding nothing —
          # which is the strict direction, so an ordinary one-migration PR would fail for the
          # wrong reason and the gate would be switched off within a week. Full history instead.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Production is not auto-migrated (deploy-functions.yml), so the repo can run ahead of the
      # database — it did, by 6 weeks and 24 migrations, and only a failing query revealed it.
      #
      # Two halves, and the flag is which one applies:
      #   --main  any pending migration FAILS. Main is the branch production should match, and
      #           the red X is the standing alarm until somebody pushes it.
      #   --pr    STACKING fails: adding a migration while an earlier one is still pending.
      #           A PR that adds NONE passes with a ::warning:: naming what is pending.
      #
      # The second half used to fail every PR while anything was pending. On 2026-09-08 one
      # unapplied migration turned every open PR red — a docs change, a validation fix, a test —
      # none of which could clear it, because clearing it needs `supabase db push` and a manifest
      # line that no PR can carry. This step also runs BEFORE typecheck and build, so those
      # reported `skipped` and nothing had a typecheck signal for as long as the drift stood.
      #
      # `github.event_name` is the only place that knows which context this is, so it is passed
      # rather than guessed. continue-on-error is deliberately NOT set: the warning path exits 0
      # by itself, and a step that cannot fail is not a gate.
      - name: Migration drift gate
        run: >
          node scripts/check-migration-drift.mjs
          origin/${{ github.base_ref || 'main' }}
          ${{ github.event_name == 'pull_request' && '--pr' || '--main' }}

      # A message sent from the public Contact page landed in `leads` and told
      # nobody, and nothing in CI had an opinion about that. WIRING_REGISTER.md
      # records, for every control on every page, where it goes and who finds
      # out; this regenerates it from the code and fails if the committed file
      # differs. So a new control cannot be added without saying what it
      # promises, where it lands, who is told and what proves it — and a wire
      # that is deleted cannot leave a stale row behind claiming it still works.
      - name: Wiring register
        run: node scripts/wiring/build.mjs --check

      # Both referenced projects explicitly. `npx tsc --noEmit` reads the root
      # tsconfig.json, which is a project-references stub: it has "files": []
      # and no "include", so outside of --build mode it typechecks NOTHING and
      # exits 0. That is not a theory: on 5ed5bbf the app project had 20 real
      # errors while this step passed green.
      - name: Type check
        run: |
          npx tsc -p tsconfig.app.json --noEmit
          npx tsc -p tsconfig.node.json --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_PROJECT_ID: "ci-test"
          VITE_SUPABASE_PUBLISHABLE_KEY: "ci-test-key"
          VITE_SUPABASE_URL: "https://ci-test.supabase.co"

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --reporter=verbose

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high || true

      - name: Check for .env files in repo
        run: |
          if [ -f .env ] && git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env file is tracked by git! Remove it immediately."
            exit 1
          fi
          echo "No .env files tracked by git."
