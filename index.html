    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker
            .register("/sw.js")
            .then(function (reg) {
              console.log("[Care Conneqt] Service worker registered:", reg.scope);

            .catch(function (err) {
              console.warn("[Care Conneqt] Service worker registration failed:", err);
            });
        });
      }
