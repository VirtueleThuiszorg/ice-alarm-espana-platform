name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede an in-flight run for PR pushes only. On main every merge's verdict has to
  # survive: during the 2026-07-25 burst (#84-#88) each merge cancelled the previous main
  # run, so runs 168/171/172/174 read "cancelled" and the red X for the nl.json break never
  # appeared on main until two merges later. Only Vercel failed loudly.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-typecheck-build:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The migration-drift gate below diffs this branch against its merge base. The default
          # shallow clone has no merge base, and the gate then treats the PR as adding nothing —
          # which is the strict direction, so an ordinary one-migration PR would fail for the
          # wrong reason and the gate would be switched off within a week. Full history instead.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Production is not auto-migrated (deploy-functions.yml), so the repo can run ahead of the
      # database — it did, by 6 weeks and 24 migrations, and only a failing query revealed it.
      # This fails a PR that adds a migration while an EARLIER one is still unapplied. One
      # pending migration is normal; two means the first was never pushed.
      - name: Migration drift gate
        run: node scripts/check-migration-drift.mjs origin/${{ github.base_ref || 'main' }}

      # Both referenced projects explicitly. `npx tsc --noEmit` reads the root
      # tsconfig.json, which is a project-references stub: it has "files": []
      # and no "include", so outside of --build mode it typechecks NOTHING and
      # exits 0. That is not a theory: on 5ed5bbf the app project had 20 real
      # errors while this step passed green.
      - name: Type check
        run: |
          npx tsc -p tsconfig.app.json --noEmit
          npx tsc -p tsconfig.node.json --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_PROJECT_ID: "ci-test"
          VITE_SUPABASE_PUBLISHABLE_KEY: "ci-test-key"
          VITE_SUPABASE_URL: "https://ci-test.supabase.co"

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --reporter=verbose

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high || true

      - name: Check for .env files in repo
        run: |
          if [ -f .env ] && git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env file is tracked by git! Remove it immediately."
            exit 1
          fi
          echo "No .env files tracked by git."
