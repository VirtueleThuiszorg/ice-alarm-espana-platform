name: CI

# ONE GATE PER JOB, and that is the whole point of this file's shape.
#
# Until 2026-09-09 the migration drift gate, the wiring register check, typecheck and build were
# four steps of ONE job, in that order. A step that fails ends its job, so the three after it
# reported `skipped` — and `skipped` is not red. Main carried five unapplied migrations for a day,
# so the drift gate failed first every time, and for that whole day main had NO SIGNAL AT ALL for
# typecheck, build or register freshness.
#
# That is not a theory about what could go wrong. Both of these got onto main through the hole:
#   - a syntax error in `src/test/absentAdminEvents.test.ts` (an unclosed `it(`), which made the
#     file unparseable — invisible because typecheck never ran (#268).
#   - the review fix for a live auth stale-token hole, dropped by a half-merge and unnoticed
#     because nothing was checking anything (#273).
#
# So each gate now gets its own job. A failing drift gate is one red X beside four other verdicts
# that still mean something, instead of one red X and three shrugs. The gates are independent —
# none needs another's output — so there are no `needs:` edges and they all run in parallel.
#
# WHY THE TWO NEW JOBS DO NOT RUN `npm ci`: `check-migration-drift.mjs` and `scripts/wiring/*.mjs`
# import nothing but `node:` builtins. Installing 1,200 packages to run them would add a minute
# and a second way for either gate to fail for a reason that has nothing to do with the gate.
#
# SECRETS FAIL, THEY DO NOT SKIP. No job here needs one, and if one ever does it must declare it
# through `scripts/ci/require-secrets.mjs` — never with a conditional that turns a missing secret
# into a green tick. `src/test/ciJobIsolation.test.ts` enforces both halves of that across every
# workflow in this directory.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede an in-flight run for PR pushes only. On main every merge's verdict has to
  # survive: during the 2026-07-25 burst (#84-#88) each merge cancelled the previous main
  # run, so runs 168/171/172/174 read "cancelled" and the red X for the nl.json break never
  # appeared on main until two merges later. Only Vercel failed loudly.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Production is migrated by `migrate.yml` on every push to main that touches
  # supabase/migrations/**. Before that (until 2026-09-09) it was a human running `supabase db
  # push`, and the repo ran ahead of the database by 6 weeks and 24 migrations before a failing
  # query revealed it. This gate is what makes the gap visible either way.
  #
  # Two halves, and the flag is which one applies:
  #   --main  any pending migration FAILS. Main is the branch production should match, and
  #           the red X is the standing alarm until somebody pushes it.
  #   --pr    STACKING fails: adding a migration while an earlier one is still pending.
  #           A PR that adds NONE passes with a ::warning:: naming what is pending.
  #
  # `github.event_name` is the only place that knows which context this is, so it is passed
  # rather than guessed. continue-on-error is deliberately NOT set: the warning path exits 0
  # by itself, and a step that cannot fail is not a gate.
  migration-drift:
    name: Migration drift gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The gate diffs this branch against its merge base. The default shallow clone has no
          # merge base, and the gate then treats the PR as adding nothing — which is the strict
          # direction, so an ordinary one-migration PR would fail for the wrong reason and the
          # gate would be switched off within a week. Full history instead.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Migration drift gate
        run: >
          node scripts/check-migration-drift.mjs
          origin/${{ github.base_ref || 'main' }}
          ${{ github.event_name == 'pull_request' && '--pr' || '--main' }}

  # ASKS PRODUCTION WHETHER THE MANIFEST IS TRUE. The gate above compares the repo against
  # APPLIED_TO_PROD.txt and cannot tell whether that file is right, because it has nothing to
  # check it against. On 2026-09-09 it was wrong: production had `20260909100000`,
  # `20260909110000` and `20260909121500` applied by hand and the manifest named none of them.
  # That went unnoticed until the first automated migrate run failed — `supabase db push` refuses
  # to run when an unapplied migration sits behind the newest applied one, which is exactly the
  # state those unrecorded hand-pushes created.
  #
  # MAIN ONLY, and that is not a compromise. A pull request has no database to ask: the secrets
  # are not available to a fork, and the manifest on a branch is not what production is measured
  # against anyway. So the file-based half runs everywhere and this half runs where the truth is
  # knowable. Because it only runs where the credentials are supposed to exist, a missing secret
  # is a real failure here and `require-secrets` treats it as one.
  #
  # It reads. It changes nothing.
  migration-truth:
    name: Manifest matches production
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require truth-check secrets
        run: >
          node scripts/ci/require-secrets.mjs
          SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # THE SAME SCRIPT migrate.yml uses, and that is the point of this change. This job links
      # to the same project with the same secrets, so when `supabase link` began being refused it
      # went red and STAYED red — on every push to main, for a reason nothing in the commit could
      # fix. A required gate that cannot pass is as bad as one that cannot fail: it trains people
      # to merge past a red X, and it can hide a second, real failure behind the first.
      - name: Reach production
        id: conn
        run: scripts/ci/reach-production.sh "check the manifest"

      - name: Manifest matches production
        run: node scripts/ci/check-manifest-truth.mjs

  # A message sent from the public Contact page landed in `leads` and told nobody, and nothing in
  # CI had an opinion about that. WIRING_REGISTER.md records, for every control on every page,
  # where it goes and who finds out; this regenerates it from the code and fails if the committed
  # file differs. So a new control cannot be added without saying what it promises, where it
  # lands, who is told and what proves it — and a wire that is deleted cannot leave a stale row
  # behind claiming it still works.
  #
  # ON A PR IT CHECKS. ON MAIN IT REPAIRS, and the difference is deliberate.
  #
  # The register is generated, and `.gitattributes` asks git to regenerate rather than merge it
  # (scripts/wiring/merge-driver.mjs). But git will not run a merge driver a repository merely
  # names — that is a clone-safety rule, not an oversight — so the driver only exists in a
  # checkout where somebody ran `npm run setup`. A contributor who has not, or a merge performed
  # by the GitHub UI, still gets an ordinary textual merge of a generated file: the interleaving
  # that put a duplicated `table:leads` row, with contradictory scores, onto main.
  #
  # A red `Wiring register` on main does not fix that. It reports it, and main stays red until a
  # human runs one command — which, on a file nobody edits by hand, is pure interruption. So on
  # main the job runs the generator and COMMITS the result if it differs. One run, self-healed,
  # same pattern as the migration manifest in migrate.yml.
  #
  # THIS CANNOT LOOP: the commit changes only WIRING_REGISTER.md, the next run regenerates,
  # finds no difference, and commits nothing.
  #
  # It stays a HARD FAILURE on pull requests, where the author is present and the register is
  # part of what is being reviewed. Self-healing there would mean a reviewer reading a diff whose
  # register belongs to a different commit.
  wiring-register:
    name: Wiring register
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # To push the regenerated register back to main. Nothing else.
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The self-heal commits and pushes; the default detached checkout cannot.
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # PRs: the gate, unchanged. An author with a stale register regenerates it themselves.
      - name: Wiring register
        if: github.event_name == 'pull_request'
        run: node scripts/wiring/build.mjs --check

      # main: regenerate and commit the difference rather than going red over a generated file.
      - name: Regenerate and self-heal on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node scripts/wiring/build.mjs

          if git diff --quiet -- WIRING_REGISTER.md; then
            echo "Register matches the code."
            exit 0
          fi

          echo "::warning title=Register was stale on main::A merge landed a WIRING_REGISTER.md that is not the generator's output. Regenerating and committing it. If this fires often, somebody is merging without the driver — see scripts/setup-repo.sh."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WIRING_REGISTER.md
          git commit -m "chore(wiring): regenerate WIRING_REGISTER.md after a merge ${RUN_URL}"

          # main moves while this runs. Rebase and retry rather than force: this commit only ever
          # rewrites one generated file, so a rebase can never lose somebody else's work.
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Register repaired on main."
              exit 0
            fi
            echo "::notice::push rejected (attempt ${attempt}); rebasing on main and retrying."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; node scripts/wiring/build.mjs; git add WIRING_REGISTER.md; git commit -q --amend --no-edit; }
            sleep $((attempt * 3))
          done

          echo "::error title=Register not repaired::WIRING_REGISTER.md is stale on main and the repair commit could not be pushed. Run: node scripts/wiring/build.mjs"
          exit 1
  # IS THE MERGE GATE ITSELF ON?
  #
  # Ruleset `main` was created 2026-07-16 and left `enforcement: disabled`. It stayed off through
  # the outages of 23 and 25 July and the broken main of 11 September — every one of them a red
  # guard merged past — and NOTHING went red to say so, because an unprotected branch looks exactly
  # like a branch nobody has protected yet. This job is the thing that would have said so.
  #
  # It reads `/rules/branches/main`, which answers "what applies to this branch right now" rather
  # than "does a ruleset exist": a disabled ruleset, or one targeting no branch, returns an empty
  # list, and both were true here.
  #
  # Its own job, per the rule below: a failing step marks every later step `skipped`, and `skipped`
  # is not red.
  merge-gate:
    name: Merge gate is enforced
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Uniform with every other job that maps a secret into env, and `ciJobIsolation.test.ts`
      # caught this job for skipping it. `GITHUB_TOKEN` is supplied by Actions rather than
      # configured, so it should never be absent — but "should never be absent" is exactly the
      # assumption that turns into a job doing nothing and reporting green.
      - name: Require the token
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/require-secrets.mjs GITHUB_TOKEN

      - name: Merge gate is enforced
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/check-merge-gate.mjs

  lint-typecheck-build:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Both referenced projects explicitly. `npx tsc --noEmit` reads the root
      # tsconfig.json, which is a project-references stub: it has "files": []
      # and no "include", so outside of --build mode it typechecks NOTHING and
      # exits 0. That is not a theory: on 5ed5bbf the app project had 20 real
      # errors while this step passed green.
      - name: Type check
        run: |
          npx tsc -p tsconfig.app.json --noEmit
          npx tsc -p tsconfig.node.json --noEmit

      - name: Build
        run: npm run build
        env:
          # Deliberately fake, not secrets. The build only needs these to be present and
          # syntactically valid; it never connects. Real values here would put production
          # credentials in a build artifact that every fork's PR run can reach.
          VITE_SUPABASE_PROJECT_ID: "ci-test"
          VITE_SUPABASE_PUBLISHABLE_KEY: "ci-test-key"
          VITE_SUPABASE_URL: "https://ci-test.supabase.co"

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --reporter=verbose

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high || true

      - name: Check for .env files in repo
        run: |
          if [ -f .env ] && git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env file is tracked by git! Remove it immediately."
            exit 1
          fi
          echo "No .env files tracked by git."
